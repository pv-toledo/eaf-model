[project]
name = "eaf-model"
version = "0.1.0"
description = "Electric arc furnace scrap charge cost optimizer"
authors = [
    { name = "Paulo Vinícius Vieira Toledo", email = "pvvtoledo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyright]
typeCheckingMode = "standard"

[tool.fastapi]
entrypoint = "api.main:app"
